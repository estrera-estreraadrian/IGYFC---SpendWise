<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="app">
        <div class="sidebar">
            <h1>SpendWise</h1>
            <span class="subheading">WORKSPACE</span>
            <div class="buttons">
                <div class="sidebar-button">
                    <i class="fa-solid fa-magnifying-glass-chart"></i>
                    <p>Overview</p>
                </div>
                <div class="sidebar-button">
                    <i class="fa-solid fa-receipt"></i>
                    <p>Transactions</p>
                </div>
                <div class="sidebar-button">
                    <i class="fa-solid fa-chart-column"></i>
                    <p>Analytics</p>
                </div>
                <div class="sidebar-button">
                    <i class="fa-solid fa-gauge-simple-high"></i>
                    <p>Budgets</p>
                </div>
                <div class="sidebar-button">
                    <i class="fa-solid fa-bullseye"></i>
                    <p>Savings Goals</p>
                </div>
                <div class="sidebar-button">
                    <i class="fa-solid fa-wallet"></i>
                    <p>Plan Before Spending</p>
                </div>
                <div class="sidebar-button">
                    <i class="fa-regular fa-lightbulb"></i>
                    <p>Insights and Alerts</p>
                </div>
                <div class="sidebar-button">
                    <i class="fa-solid fa-briefcase"></i>
                    <p>Business Finances</p>
                </div>
                <span class="subheading">ACCOUNT</span>
                <div class="sidebar-button">
                    <i class="fa-solid fa-gear"></i>
                    <p>Settings</p>
                </div>
            </div>
        </div>
        <div class="content">
            <div class="heading">

            </div>
        </div>
    </div>
</body>
</html>
